[project]
name = "revision-scolaire"
version = "0.1.0"
description = "Application privée de révision scolaire"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
