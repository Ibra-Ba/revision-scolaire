
[project]
name = "revision-scolaire"
version = "0.1.0"
description = "Application privée de révision scolaire"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
